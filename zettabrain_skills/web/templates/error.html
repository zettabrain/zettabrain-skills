<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - 3RVA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .error-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        h1 {
            color: #ef4444;
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .error-message {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            padding: 20px;
            text-align: left;
            border-radius: 5px;
            margin: 25px 0;
            color: #991b1b;
        }

        .suggestion {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 20px;
            text-align: left;
            border-radius: 5px;
            margin: 25px 0;
            color: #1e40af;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="error-icon">⚠️</div>
            <h1>Something Went Wrong</h1>

            <div class="error-message">
                <strong>Error:</strong><br>
                {{ error }}
            </div>

            {% if suggestion %}
            <div class="suggestion">
                <strong>💡 Suggestion:</strong><br>
                {{ suggestion }}
            </div>
            {% endif %}

            <a href="/" class="button">← Back to Home</a>
        </div>
    </div>
</body>
</html>
