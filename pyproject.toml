[tool.poetry]
name = "zettabrain-skills"
version = "0.5.0"
description = "Open-source skill-based document generation platform with AI"
authors = ["ZettaBrain <hello@zettabrain.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/zettabrain/zettabrain-skills"
repository = "https://github.com/zettabrain/zettabrain-skills"
keywords = ["ai", "llm", "document-generation", "skills", "automation"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
click = "^8.0.0"
pydantic = "^2.5.0"
pyyaml = "^6.0"
httpx = "^0.25.2"
python-multipart = "^0.0.6"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-frontmatter = "^1.1.0"
rich = "^13.7.0"
jinja2 = "^3.1.2"
weasyprint = "^60.0"
markdown = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.1"
ipython = "^8.18.0"

[tool.poetry.scripts]
zbs = "zettabrain_skills.cli.main:app"
zettabrain-skills = "zettabrain_skills.cli.main:app"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
